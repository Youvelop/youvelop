<svg xmlns="http://www.w3.org/2000/svg" width="830" height="196" viewBox="0 0 830 196" role="img" aria-label="tail -f ~/now.log">
<defs>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb454" stop-opacity="0"/><stop offset=".5" stop-color="#ffb454" stop-opacity=".05"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="828" height="194" rx="10"/></clipPath>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace;white-space:pre;fill:#d6dde6}
.d{fill:#5d6672}.a{fill:#ffb454}.b{fill:#5fd7c4}.f{fill:#1c2128}
.in{animation:in .3s ease-out both}
@keyframes in{from{opacity:0}to{opacity:1}}
.cur{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.roll{animation:roll 7s linear infinite}
@keyframes roll{from{transform:translateY(-90px)}to{transform:translateY(196px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
